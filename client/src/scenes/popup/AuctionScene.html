<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Auction Scene (CDN JS Demo)</title>
    <style>
      /* 최소 스타일 - Tailwind를 사용하지 않는 환경을 위해 간단하게 만듭니다. */
      body {
        background: #0f1724;
        color: #e6eef8;
        font-family: Inter, system-ui, -apple-system, Roboto, "Helvetica Neue",
          Arial;
        margin: 0;
        padding: 20px;
      }
      .container {
        max-width: 1100px;
        margin: 0 auto;
      }
      .card {
        background: #1a1d2e;
        border-radius: 12px;
        padding: 16px;
        border: 1px solid rgba(255, 255, 255, 0.06);
      }
      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 16px;
      }
      .left {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .title {
        font-size: 18px;
        font-weight: 600;
      }
      .tabs {
        display: flex;
        gap: 8px;
      }
      .btn {
        padding: 8px 14px;
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid rgba(255, 255, 255, 0.06);
        color: #e6eef8;
        cursor: pointer;
        font-size: 14px;
        height: 40px;
      }
      .btn.active {
        background: linear-gradient(90deg, #a855f7, #7c3aed);
        box-shadow: 0 0 24px rgba(168, 85, 247, 0.2);
      }
      .btn.filter {
        padding: 6px 12px;
        font-size: 13px;
        height: 40px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }
      .btn.filter.active {
        background: #4ea8de;
        box-shadow: none;
      }
      .search {
        position: relative;
      }
      .search input {
        padding: 10px 12px 10px 36px;
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.03);
        color: inherit;
        border: 1px solid rgba(255, 255, 255, 0.06);
        height: 40px; /* match filter/button height */
        box-sizing: border-box;
      }
      .search .icon {
        position: absolute;
        left: 10px;
        top: 50%;
        transform: translateY(-50%);
      }
      .controls {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 16px;
      }
      .empty-state {
        text-align: center;
        padding: 60px 20px;
        color: #9aa3b2;
      }
      .item-card {
        background: #252838;
        border-radius: 12px;
        padding: 16px;
        border: 1px solid rgba(255, 255, 255, 0.06);
        margin-bottom: 12px;
        transition: all 0.2s;
      }
      .item-card:hover {
        border-color: rgba(255, 215, 0, 0.3);
        box-shadow: 0 0 20px rgba(255, 215, 0, 0.1);
      }
      .item-content {
        display: grid;
        grid-template-columns: 1fr 90px 150px 120px;
        gap: 16px;
        align-items: center;
      }
      .item-name {
        font-size: 16px;
        font-weight: 500;
        margin-bottom: 6px;
      }
      .item-type {
        font-size: 12px;
        color: #9aa3b2;
      }
      .stat-badge {
        display: inline-block;
        padding: 4px 8px;
        border-radius: 4px;
        font-size: 12px;
        margin-right: 6px;
      }
      .stat-badge.hp {
        background: rgba(255, 107, 107, 0.15);
        border: 1px solid rgba(255, 107, 107, 0.3);
        color: #ff6b6b;
      }
      .stat-badge.def {
        background: rgba(78, 168, 222, 0.15);
        border: 1px solid rgba(78, 168, 222, 0.3);
        color: #4ea8de;
      }
      .stat-badge.atk {
        background: rgba(168, 85, 247, 0.15);
        border: 1px solid rgba(168, 85, 247, 0.3);
        color: #a855f7;
      }
      .seller-info {
        font-size: 13px;
        color: #9aa3b2;
        line-height: 1.8;
      }
      .price {
        text-align: right;
      }
      .price-label {
        font-size: 12px;
        color: #9aa3b2;
        margin-bottom: 4px;
      }
      .price-value {
        font-size: 22px;
        color: #ffd700;
        font-weight: 600;
      }
      .buy-btn {
        padding: 10px 20px;
        /* 기본 상태는 일반 버튼(.btn)과 동일한 색상/테두리로 유지 */
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid rgba(255, 255, 255, 0.06);
        border-radius: 8px;
        color: #e6eef8;
        font-weight: 600;
        cursor: pointer;
        transition: transform 0.2s, background 0.15s, box-shadow 0.15s;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        height: 40px;
      }
      .buy-btn:hover {
        /* 호버 시 기존 그라데이션 + 스케일 효과 유지 */
        background: linear-gradient(to right, #a855f7, #7c3aed);
        color: #e6eef8;
        transform: scale(1.05);
        box-shadow: 0 0 12px rgba(255, 215, 0, 0.12);
      }
      .cancel-btn {
        padding: 10px 20px;
        background: rgba(255, 107, 107, 0.15);
        border: 1px solid rgba(255, 107, 107, 0.3);
        border-radius: 8px;
        color: #ff6b6b;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.2s;
      }
      .cancel-btn:hover {
        background: rgba(255, 107, 107, 0.25);
      }
      .gold-display {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 16px;
        border-radius: 8px;
        border: 1px solid rgba(255, 255, 255, 0);
      }
      .notyf__toast {
        padding: 0px 20px !important; /* 기본 16px → 더 작게 */
        border-radius: 6px !important; /* 모서리 둥근 정도 */
        width: auto !important; /* 자동 너비 */
        max-width: 500px !important; /* 최대 너비 늘리기 */
        max-height: 100vh !important; /* 높이 최대로 */
        display: inline-block !important; /* 가로로 늘어나게 */
        box-shadow: none !important; /* 그림자 삭제 */
      }
      .notyf__message {
        font-size: 15px !important; /* 글씨 크기 줄이기 */
        line-height: 1.2 !important;
        display: block !important;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div id="root"></div>
    </div>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/notyf/notyf.min.css"
    />
    <script src="https://cdn.jsdelivr.net/npm/notyf/notyf.min.js"></script>
    <!-- React & ReactDOM (UMD builds) -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <!-- Babel (in-browser JSX transpile for demo) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Demo: AuctionScene converted from TSX -> JS (JSX) for CDN usage -->
    <script type="text/babel">
      const { useState, useEffect } = React;
      const notyf = new Notyf({ ripple: false });

      function AuctionScene({ onNavigate }) {
        const [activeTab, setActiveTab] = useState("market");
        const [activeFilter, setActiveFilter] = useState("all");
        const [sortBy, setSortBy] = useState("recent");
        const [searchQuery, setSearchQuery] = useState("");

        const [auctionItems, setAuctionItems] = useState([]);
        const [mySales, setMySales] = useState([]);
        const [myGold, setMyGold] = useState(0);

        useEffect(() => {
          window.parent.postMessage("AUCTION_READY", "*");
          const handler = (event) => {
            if (event.data?.type === "AUCTION_DATA") {
              setMyGold(event.data.payload.myGold); // UI 업데이트
              setAuctionItems(event.data.payload.auctionItems); // UI 업데이트
              setMySales(event.data.payload.mySales); // UI 업데이트
              window.parent.postMessage("AUCTION_RENDER_COMPLETE", "*");
            }
          };

          window.addEventListener("message", handler);
          return () => window.removeEventListener("message", handler);
        }, []);

        const getTypeLabel = (type) => {
          switch (type) {
            case "hat":
              return "모자";
            case "top":
              return "상의";
            case "bottom":
              return "하의";
            case "shoes":
              return "신발";
            case "gloves":
              return "장갑";
            case "weapon":
              return "무기";
            default:
              return type;
          }
        };

        // 구매 버튼 클릭 시 아이템 제거
        const handleBuy = (auctionItem) => {
          if (myGold < auctionItem.price) {
            notyf.error("골드가 부족하여 구매할 수 없습니다.");
            return;
          }
          setAuctionItems((prev) =>
            prev.filter((item) => item.id !== auctionItem.id)
          );
          setMyGold((prev) => prev - auctionItem.price);
          window.parent.postMessage(
            { type: "AUCTION_BUY_ITEM", auctionId: auctionItem.id },
            "*"
          );
          notyf.success("구매 완료!");
        };

        const handleCancelSale = (auctionId) => {
          setMySales((prev) => prev.filter((item) => item.id !== auctionId));
          window.parent.postMessage(
            { type: "AUCTION_CANCEL_SALE", auctionId: auctionId },
            "*"
          );
          notyf.success("판매 취소 완료!");
        };

        //  const auctionItems = [
        //   {
        //     id: 1,
        //     itemId: 101,
        //     name: "화염의 검",
        //     type: "weapon",
        //     icon: "🔥",
        //     atk: 65,
        //     seller: "FireMaster",
        //     price: 5000,
        //     listedAt: Date.now() - 3600000,
        //     rarity: "legendary",
        //   },
        //   {
        //     id: 2,
        //     itemId: 102,
        //     name: "다이아몬드 갑옷",
        //     type: "armor",
        //     icon: "💎",
        //     def: 80,
        //     seller: "DefenseKing",
        //     price: 8500,
        //     listedAt: Date.now() - 7200000,
        //     rarity: "legendary",
        //   },
        //   {
        //     id: 3,
        //     itemId: 103,
        //     name: "번개 반지",
        //     type: "accessory",
        //     icon: "⚡",
        //     atk: 25,
        //     seller: "ThunderGod",
        //     price: 3200,
        //     listedAt: Date.now() - 1800000,
        //     rarity: "epic",
        //   },
        //   {
        //     id: 4,
        //     itemId: 104,
        //     name: "암살자의 단검",
        //     type: "weapon",
        //     icon: "🗡️",
        //     atk: 45,
        //     seller: "ShadowNinja",
        //     price: 2800,
        //     listedAt: Date.now() - 5400000,
        //     rarity: "rare",
        //   },
        //   {
        //     id: 5,
        //     itemId: 105,
        //     name: "마법사의 로브",
        //     type: "armor",
        //     icon: "🧙",
        //     def: 35,
        //     hp: 50,
        //     seller: "MagicWizard",
        //     price: 4200,
        //     listedAt: Date.now() - 10800000,
        //     rarity: "epic",
        //   },
        // ];

        //  const mySales = [
        //   {
        //     id: 201,
        //     itemId: 201,
        //     name: "강철 방패",
        //     type: "armor",
        //     icon: "🛡️",
        //     def: 40,
        //     seller: "CurrentPlayer",
        //     price: 3500,
        //     listedAt: Date.now() - 14400000,
        //     rarity: "rare",
        //   },
        // ];

        const getTimeSince = (timestamp) => {
          const seconds = Math.floor((Date.now() - timestamp) / 1000);
          if (seconds < 3600) return `${Math.floor(seconds / 60)}분 전`;
          if (seconds < 86400) return `${Math.floor(seconds / 3600)}시간 전`;
          return `${Math.floor(seconds / 86400)}일 전`;
        };

        const filterAndSortItems = () => {
          let items = auctionItems;

          // Filter by type
          if (activeFilter !== "all") {
            items = items.filter((i) => i.type === activeFilter);
          }

          // Filter by search
          if (searchQuery) {
            items = items.filter((i) =>
              i.name.toLowerCase().includes(searchQuery.toLowerCase())
            );
          }

          // Sort
          if (sortBy === "price") {
            items = [...items].sort((a, b) => a.price - b.price);
          } else {
            items = [...items].sort((a, b) => b.listedAt - a.listedAt);
          }

          return items;
        };

        const filteredItems = filterAndSortItems();

        return (
          <div className="card">
            <div className="header">
              <div className="left">
                <img
                  src="/assets/icons/auction_icon.png"
                  alt="거래소 아이콘"
                  style={{
                    width: 18,
                    height: 18,
                  }}
                />
                <div className="title">거래소</div>
              </div>
              <div style={{ display: "flex", gap: 12, alignItems: "center" }}>
                <div className="gold-display">
                  <img
                    src="/assets/icons/coins.png"
                    width="16"
                    height="16"
                    style={{ verticalAlign: "middle" }}
                  />
                  <span style={{ color: "#ffd700", fontSize: "14px" }}>
                    보유 골드: {myGold}G
                  </span>
                </div>
                <button
                  className="btn"
                  onClick={() => {
                    const iframe =
                      window.parent.document.getElementById("react-ui");
                    iframe.src = "about:blank"; // 완전 초기화
                    iframe.style.visibility = "hidden";
                  }}
                >
                  닫기
                </button>
              </div>
            </div>

            {/* Tabs and Controls - single row */}
            <div
              style={{
                display: "flex",
                justifyContent: "space-between",
                alignItems: "center",
                marginBottom: 16,
              }}
            >
              <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
                <button
                  className={"btn " + (activeTab === "market" ? "active" : "")}
                  onClick={() => setActiveTab("market")}
                >
                  경매장
                </button>
                <button
                  className={
                    "btn " + (activeTab === "my-sales" ? "active" : "")
                  }
                  onClick={() => setActiveTab("my-sales")}
                >
                  내 판매 목록
                </button>
              </div>

              {activeTab === "market" && (
                <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
                  <div
                    style={{ display: "flex", gap: 8, alignItems: "center" }}
                  >
                    <button
                      className={
                        "btn filter " + (activeFilter === "all" ? "active" : "")
                      }
                      onClick={() => setActiveFilter("all")}
                    >
                      전체
                    </button>
                    <button
                      className={
                        "btn filter " + (activeFilter === "hat" ? "active" : "")
                      }
                      onClick={() => setActiveFilter("hat")}
                    >
                      모자
                    </button>
                    <button
                      className={
                        "btn filter " + (activeFilter === "top" ? "active" : "")
                      }
                      onClick={() => setActiveFilter("top")}
                    >
                      상의
                    </button>
                    <button
                      className={
                        "btn filter " +
                        (activeFilter === "bottom" ? "active" : "")
                      }
                      onClick={() => setActiveFilter("bottom")}
                    >
                      하의
                    </button>
                    <button
                      className={
                        "btn filter " +
                        (activeFilter === "shoe" ? "active" : "")
                      }
                      onClick={() => setActiveFilter("shoe")}
                    >
                      신발
                    </button>
                    <button
                      className={
                        "btn filter " +
                        (activeFilter === "glove" ? "active" : "")
                      }
                      onClick={() => setActiveFilter("glove")}
                    >
                      장갑
                    </button>
                    <button
                      className={
                        "btn filter " +
                        (activeFilter === "weapon" ? "active" : "")
                      }
                      onClick={() => setActiveFilter("weapon")}
                    >
                      무기
                    </button>
                  </div>
                  <div className="search">
                    <span className="icon">🔍</span>
                    <input
                      placeholder="아이템 검색..."
                      value={searchQuery}
                      onChange={(e) => setSearchQuery(e.target.value)}
                    />
                  </div>
                </div>
              )}
            </div>

            {activeTab === "market" && (
              <>
                {/* Items List */}
                <div>
                  {filteredItems.map((item) => (
                    <div key={item.id} className="item-card">
                      <div className="item-content">
                        <div>
                          <div className="item-name">
                            <span style={{ marginRight: 10 }}>{item.name}</span>
                            {item.hp && (
                              <span className="stat-badge hp">
                                +{item.hp} HP
                              </span>
                            )}
                            {item.atk && (
                              <span className="stat-badge atk">
                                +{item.atk} ATK
                              </span>
                            )}
                            {item.def && (
                              <span className="stat-badge def">
                                +{item.def} DEF
                              </span>
                            )}
                          </div>
                          <div>
                            <span className="item-type">
                              {getTypeLabel(item.type)}
                            </span>
                          </div>
                        </div>

                        <div className="seller-info">
                          <div>판매자: {item.seller}</div>
                          <div>
                            <img
                              src="/assets/icons/flatclock.png"
                              alt="clock"
                              width="11"
                              height="11"
                              style={{
                                verticalAlign: "middle",
                                marginRight: 7,
                              }}
                            />
                            <span style={{ verticalAlign: "middle" }}>
                              {getTimeSince(new Date(item.time).getTime())}
                            </span>
                          </div>
                        </div>

                        <div className="price">
                          <div className="price-label">판매가</div>
                          <div className="price-value">
                            {item.price.toLocaleString()}G
                          </div>
                        </div>

                        <div style={{ textAlign: "right" }}>
                          <button
                            className="buy-btn"
                            onClick={() => handleBuy(item)}
                          >
                            구매
                          </button>
                        </div>
                      </div>
                    </div>
                  ))}
                </div>
              </>
            )}

            {activeTab === "my-sales" && (
              <>
                <div
                  style={{
                    display: "flex",
                    alignItems: "center",
                    gap: 8,
                    marginBottom: 16,
                    color: "#9aa3b2",
                  }}
                ></div>

                <div>
                  {mySales.length > 0 ? (
                    mySales.map((item) => (
                      <div key={item.id} className="item-card">
                        <div className="item-content">
                          <div>
                            <div className="item-name">
                              <span style={{ marginRight: 10 }}>
                                {item.name}
                              </span>
                              {item.hp && (
                                <span className="stat-badge hp">
                                  +{item.hp} HP
                                </span>
                              )}
                              {item.atk && (
                                <span className="stat-badge atk">
                                  +{item.atk} ATK
                                </span>
                              )}
                              {item.def && (
                                <span className="stat-badge def">
                                  +{item.def} DEF
                                </span>
                              )}
                            </div>
                            <div>
                              <span className="item-type">
                                {getTypeLabel(item.type)}
                              </span>
                            </div>
                          </div>

                          <div className="seller-info">
                            <img
                              src="/assets/icons/flatclock.png"
                              alt="clock"
                              width="11"
                              height="11"
                              style={{
                                verticalAlign: "middle",
                                marginRight: 7,
                              }}
                            />
                            <span style={{ verticalAlign: "middle" }}>
                              {getTimeSince(new Date(item.time).getTime())}
                            </span>
                          </div>

                          <div className="price">
                            <div className="price-label">판매가</div>
                            <div className="price-value">
                              {item.price.toLocaleString()}G
                            </div>
                          </div>

                          <div style={{ textAlign: "right" }}>
                            <button
                              className="cancel-btn"
                              onClick={() => handleCancelSale(item.id)}
                            >
                              판매 취소
                            </button>
                          </div>
                        </div>
                      </div>
                    ))
                  ) : (
                    <div className="empty-state">
                      <img
                        src="/assets/icons/inventory_hide.png"
                        alt="Gold"
                        width="23"
                        height="23"
                        style={{ verticalAlign: "middle" }}
                      />
                      {"   "}
                      <span style={{ verticalAlign: "middle" }}>
                        등록된 아이템이 없습니다.
                      </span>
                    </div>
                  )}
                </div>
              </>
            )}
          </div>
        );
      }

      // 예시 렌더링: root에 붙이기
      ReactDOM.createRoot(document.getElementById("root")).render(
        React.createElement(AuctionScene, {
          onNavigate: (scene) => {
            console.log("navigate to", scene);
          },
        })
      );
    </script>
  </body>
</html>
